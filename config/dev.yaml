edgepulse:
  listen_address: 127.0.0.1
  threads: 1
  hot_reload: true
  http_port: 8080
  https_port: 8443
  agent_port: 9443
  ops_port: 9100
  ops_address: 127.0.0.1
  web_root: web
  cert_dir: var/certs
  firmware_dir: var/firmware
  maximum_firmware_bytes: 268435456
  firmware:
    # 开发档允许未签名固件；trusted_keys_dir 不存在时按空信任键处理
    require_signature: false
    trusted_keys_dir: config/firmware-keys
  telemetry_retention_days: 30
  log_retention_days: 90
  delivery_retention_days: 30
  database:
    driver: sqlite
    path: var/edgepulse.db
    host: 127.0.0.1
    port: 3306
    name: edgepulse
    user: edgepulse
  redis:
    enabled: false
    host: 127.0.0.1
    port: 6379
    database: 0
  migrations_dir: migrations
  captcha:
    ttl_seconds: 120
    expose_code: true
    requests_per_minute: 30
  session:
    ttl_seconds: 7200
  security:
    allowed_origins: http://127.0.0.1:5173,http://localhost:5173
    # 打开后跳过整个私网/保留段分类：普通私网、回环、CGNAT、组播、保留与文档示例段（含 IPv6 唯一本地）
    # 都会放行；云元数据与链路本地地址始终拒绝
    allow_private_webhooks: true
    # 开发档放宽口令策略，保留历史种子账号与本地验收脚本的弱口令
    password_min_length: 8
    password_require_complexity: false
    login_failure_window_seconds: 900
    login_max_failures: 5
    login_lock_seconds: 900
  agent:
    fingerprint: ""
    enrollment_mode: "off"
    heartbeat_interval_seconds: 10
    heartbeat_timeout_seconds: 30
    offline_sweep_seconds: 5
  agent_ca:
    # 开发档复用 scripts/dev-certs.sh 生成的 CA，证书与 cert_dir/ca.pem 是同一文件；
    # 私钥在 var/certs 下，已被 .gitignore 排除
    enabled: true
    certificate_file: var/certs/ca.pem
    key_file: var/certs/ca-key.pem
    validity_days: 30
    overlap_hours: 24
  udp_telemetry:
    enabled: false
    address: 0.0.0.0
    port: 9555
  oidc:
    enabled: false
    issuer: https://idp.example.com
    client_id: edgepulse
    redirect_uri: https://console.example.com/api/auth/oidc/callback
    frontend_redirect: /login
    scopes: openid profile email
    allowed_email_domains: ""
    auto_provision: false
    default_role_id: 0
    default_dept_id: 101
    tenant_code: default
  reverse_proxy:
    enabled: false
    prefix: /edge
    upstream: http://127.0.0.1:9000
    strip_prefix: true
    require_session: true
    permission: ""
    timeout_ms: 15000
    maximum_request_bytes: 8388608
    maximum_response_bytes: 8388608

server:
  limits:
    idle_timeout_ms: 75000
    read_timeout_ms: 60000
    write_timeout_ms: 60000
  quic:
    idle_timeout_seconds: 30  # h3 传输层空闲超时，1..3600；server.limits.idle_timeout_ms 不控制 h3
  parser_limits:
    maximum_body_size: 16777216
  rate_limit:
    requests_per_second: 0.0  # 整数与小数均可（如 10 或 0.5）；0 关闭
    burst_capacity: 1.0

metrics:
  enabled: false
  service_name: EdgePulse
  service_version: 1.0.0
  export_interval_ms: 15000
  otlp:
    endpoint: http://127.0.0.1:4318/v1/metrics
    timeout_ms: 3000
