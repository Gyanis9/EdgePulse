edgepulse:
  listen_address: 127.0.0.1
  http_port: 8080
  https_port: 8443
  agent_port: 9443
  ops_port: 9100
  ops_address: 127.0.0.1
  web_root: web
  cert_dir: var/certs
  database:
    driver: sqlite
    path: var/edgepulse.db
  captcha:
    ttl_seconds: 120
    expose_code: true
  session:
    ttl_seconds: 7200
  security:
    allowed_origins: http://127.0.0.1:5173,http://localhost:5173
  agent:
    fingerprint: ""

server:
  limits:
    idle_timeout_ms: 75000
    read_timeout_ms: 60000
    write_timeout_ms: 60000
  parser_limits:
    maximum_body_size: 16777216
  rate_limit:
    requests_per_second: 0.0
    burst_capacity: 1.0
