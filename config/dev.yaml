edgepulse:
  listen_address: 127.0.0.1
  threads: 1
  hot_reload: true
  http_port: 8080
  https_port: 8443
  agent_port: 9443
  ops_port: 9100
  ops_address: 127.0.0.1
  web_root: web
  cert_dir: var/certs
  firmware_dir: var/firmware
  maximum_firmware_bytes: 268435456
  telemetry_retention_days: 30
  database:
    driver: sqlite
    path: var/edgepulse.db
    host: 127.0.0.1
    port: 3306
    name: edgepulse
    user: edgepulse
  redis:
    enabled: false
    host: 127.0.0.1
    port: 6379
    database: 0
  migrations_dir: migrations
  captcha:
    ttl_seconds: 120
    expose_code: true
    requests_per_minute: 30
  session:
    ttl_seconds: 7200
  security:
    allowed_origins: http://127.0.0.1:5173,http://localhost:5173
  agent:
    fingerprint: ""
  udp_telemetry:
    enabled: false
    address: 0.0.0.0
    port: 9555

server:
  limits:
    idle_timeout_ms: 75000
    read_timeout_ms: 60000
    write_timeout_ms: 60000
  parser_limits:
    maximum_body_size: 16777216
  rate_limit:
    requests_per_second: 0.0
    burst_capacity: 1.0

metrics:
  enabled: false
  service_name: EdgePulse
  service_version: 1.0.0
  export_interval_ms: 15000
  otlp:
    endpoint: http://127.0.0.1:4318/v1/metrics
    timeout_ms: 3000
