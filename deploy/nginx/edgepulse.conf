# EdgePulse HA 反向代理样例，挂载为 nginx 主配置 /etc/nginx/nginx.conf。
#
# 端口分工：
#   8080  HTTP，浏览器与管理 API 明文入口
#   8443  HTTPS，在 nginx 终止 TLS 后转发到应用 8080
#   9443  TCP 透传，Agent mTLS 直连两个实例之一；nginx 不解析也不终止这条连接
#
# TLS 终止方式二选一：
#   1. 由 nginx 终止：保留下面的 8443 server，应用配置 edgepulse.https_port: 0，
#      只监听 8080/9443。证书必须覆盖对外域名；本文件只读取 /etc/nginx/certs 下的
#      server.pem 与 server-key.pem，该目录不要放 ca.pem 或 Agent CA 私钥。
#   2. 由外层负载均衡终止：删掉 8443 server 并把 8080 限定在内网，应用仍可保留
#      https_port: 8443；9443 透传不变，Agent 始终直连 mTLS 端口。
#
# 开源 nginx 没有主动健康检查：这里用 upstream 的 max_fails/fail_timeout 做被动摘除，
# 并用 proxy_next_upstream 在连接失败、超时或 502/503/504 时换一台。普通接口允许重试
# 502/503/504；/api/ws 与 /api/events/ 只允许 error timeout，且都在升级或首字节之前，
# 已经建立的连接不会被换上游。三类 location 都不打开 non_idempotent，避免命令创建这类
# POST 被重复提交。
#
# 上游主机名在启动时由 Docker DNS 解析一次。容器被重建且 IP 变化后要
# docker compose restart nginx（或 nginx -s reload）才会重新解析；要让 nginx 定期重解析，
# 得把 upstream 换成变量配合 resolver 127.0.0.11，代价是失去 keepalive 与启动期失败早退，
# 本样例不做。静态地址或编排重建后统一重启的发布方式不需要它。

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr request_time=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65s;
    client_max_body_size 256m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream edgepulse_http {
        # 同一镜像、同一端口；两个实例共享 MySQL/Redis/固件卷
        server edgepulse-1:8080 max_fails=2 fail_timeout=5s;
        server edgepulse-2:8080 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    # 浏览器 WebSocket 与 SSE 需要长连接；其余 API 走普通代理
    server {
        listen 8080;
        server_name _;

        location = /api/ws {
            proxy_pass http://edgepulse_http;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # 只在连接失败或超时时换上游：此时升级还没有完成，重试不会破坏会话
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        location /api/events/ {
            proxy_pass http://edgepulse_http;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3600s;
            # SSE 尚未收到首字节时换上游是安全的；已建立的事件流不会重放
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        location / {
            proxy_pass http://edgepulse_http;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 300s;
            # 固件上传是流式请求，代理不要先收完整包再转发
            proxy_request_buffering off;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }

    # 由 nginx 终止 TLS 时使用。证书替换为覆盖对外域名的生产证书；
    # 应用把 https_port 设为 0 后由这里统一转回 8080。
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.pem;
        ssl_certificate_key /etc/nginx/certs/server-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:edgepulse_ssl:10m;
        ssl_session_timeout 10m;

        location = /api/ws {
            proxy_pass http://edgepulse_http;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # 只在连接失败或超时时换上游：此时升级还没有完成，重试不会破坏会话
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        location /api/events/ {
            proxy_pass http://edgepulse_http;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3600s;
            # SSE 尚未收到首字节时换上游是安全的；已建立的事件流不会重放
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        location / {
            proxy_pass http://edgepulse_http;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}

stream {
    upstream edgepulse_agent {
        # Agent 自带客户端证书，TCP 透传到实例 9443；实例不可用时换另一台
        server edgepulse-1:9443 max_fails=2 fail_timeout=5s;
        server edgepulse-2:9443 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 9443;
        proxy_pass edgepulse_agent;
        proxy_connect_timeout 5s;
        proxy_timeout 3600s;
        proxy_next_upstream on;
    }
}
