# 单实例编排：用于开发与非 HA 验收，不提供故障切换。HA 请用同目录的
# docker-compose.ha.yml；那份编排把证书按应用/nginx 分工拆开，并有独立的 Agent CA 私钥卷。
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: edgepulse
      MYSQL_USER: edgepulse
      MYSQL_PASSWORD: ${EDGEPULSE_DB_PASSWORD:?请在 .env 中设置 EDGEPULSE_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${EDGEPULSE_REDIS_PASSWORD:?请在 .env 中设置 EDGEPULSE_REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${EDGEPULSE_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  edgepulse:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EDGEPULSE_DB_PASSWORD: ${EDGEPULSE_DB_PASSWORD}
      EDGEPULSE_REDIS_PASSWORD: ${EDGEPULSE_REDIS_PASSWORD}
      EDGEPULSE_OPS_BEARER_TOKEN: ${EDGEPULSE_OPS_BEARER_TOKEN:?请在 .env 中设置 EDGEPULSE_OPS_BEARER_TOKEN}
      EDGEPULSE_AGENT_FINGERPRINT: ${EDGEPULSE_AGENT_FINGERPRINT:-}
      EDGEPULSE_UDP_TELEMETRY_SECRET: ${EDGEPULSE_UDP_TELEMETRY_SECRET:-}
      EDGEPULSE_OIDC_CLIENT_SECRET: ${EDGEPULSE_OIDC_CLIENT_SECRET:-}
      EDGEPULSE_MFA_KEY: ${EDGEPULSE_MFA_KEY:-}
      EDGEPULSE_INITIAL_PASSWORD: ${EDGEPULSE_INITIAL_PASSWORD:-}
    volumes:
      - ../../config:/app/config:ro
      # 只挂应用实际读取的三个文件；var/certs 里的 ca-key.pem 不进入容器。
      # 启用 Agent 内部 CA 时再按 docs/部署.md 第 7 节单独挂私钥。
      - ../../var/certs/ca.pem:/etc/edgepulse/tls/ca.pem:ro
      - ../../var/certs/server.pem:/etc/edgepulse/tls/server.pem:ro
      - ../../var/certs/server-key.pem:/etc/edgepulse/tls/server-key.pem:ro
      - firmware-data:/var/lib/edgepulse/firmware
    ports:
      - "8080:8080"
      - "8443:8443/tcp"
      - "8443:8443/udp"
      - "9443:9443"
      - "9100:9100"
      - "9555:9555/udp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v2.53.0
    depends_on:
      - edgepulse
    volumes:
      - ../prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

volumes:
  mysql-data:
  redis-data:
  firmware-data:
