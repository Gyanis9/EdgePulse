name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force
      - name: Build engine package
        run: conan create 3rd/AsynGyanis/packaging/conan --build=missing -s compiler.cppstd=23 -s build_type=Release -o "&:with_mysql=True"
      - name: Install dependencies
        run: conan install . --build=missing -s compiler.cppstd=23 -s build_type=Release
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug --output-on-failure

  backend-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++ libssl-dev default-libmysqlclient-dev
      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force
      - name: Build engine package
        run: conan create 3rd/AsynGyanis/packaging/conan --build=missing -s compiler.cppstd=23 -s build_type=Release -o "&:with_mysql=True"
      - name: Install dependencies
        run: conan install . --build=missing -s compiler.cppstd=23 -s build_type=Release
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug --output-on-failure

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
