name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force
      - name: Build engine package
        run: conan create 3rd/AsynGyanis/packaging/conan --build=missing -s compiler.cppstd=23 -s build_type=Release -o "&:with_mysql=True"
      - name: Install dependencies
        run: conan install . --build=missing -s compiler.cppstd=23 -s build_type=Release
      - name: Configure
        run: cmake --preset debug
      - name: Check OpenAPI drift
        run: python scripts/generate-openapi.py --check
      - name: Build
        run: cmake --build --preset debug
      - name: Build agent targets
        run: cmake --build --preset debug --target edgepulse-agent edgepulse-agent-test-hook
      - name: Assert agent binaries exist
        shell: pwsh
        run: |
          foreach ($path in @('build/debug/bin/edgepulse-agent.exe', 'build/debug/bin/edgepulse-agent-test-hook.exe')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "缺少 Agent 构建产物：$path"
            }
            Write-Host "FOUND: $path"
          }
      - name: PowerShell parser check
        shell: pwsh
        run: |
          $files = @(
            'agent/packaging/windows/install-agent.ps1',
            'agent/packaging/windows/uninstall-agent.ps1',
            'scripts/package-agent.ps1',
            'scripts/check-agent-windows-service.ps1'
          )
          $failed = $false
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              Write-Host "PARSE_ERROR: $file 不存在"
              $failed = $true
              continue
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $errors) {
                Write-Host "PARSE_ERROR: $file`: $($parseError.Message)"
              }
            } else {
              Write-Host "PARSE_OK: $file"
            }
          }
          if ($failed) {
            exit 1
          }
      - name: Test
        run: ctest --preset debug --output-on-failure

  backend-linux:
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
      EDGEPULSE_TEST_MYSQL_HOST: 127.0.0.1
      EDGEPULSE_TEST_MYSQL_PORT: "3306"
      EDGEPULSE_TEST_MYSQL_USER: root
      EDGEPULSE_TEST_MYSQL_PASSWORD: test
      EDGEPULSE_TEST_MYSQL_DATABASE: edgepulse_test
      EDGEPULSE_TEST_REDIS_HOST: 127.0.0.1
      EDGEPULSE_TEST_REDIS_PORT: "6379"
      EDGEPULSE_TEST_REDIS_PASSWORD: ""
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: edgepulse_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++ g++-14 libssl-dev default-libmysqlclient-dev
      - name: Install Conan
        env:
          CC: gcc
          CXX: g++
        run: |
          pip install conan
          conan profile detect --force
      - name: Build engine package
        env:
          CC: gcc
          CXX: g++
        run: conan create 3rd/AsynGyanis/packaging/conan --build=missing -s compiler.cppstd=23 -s build_type=Release -o "&:with_mysql=True"
      - name: Install dependencies
        run: conan install . --build=missing -s compiler.cppstd=23 -s build_type=Release
      - name: Configure
        run: cmake --preset debug
      - name: Check OpenAPI drift
        run: python3 scripts/generate-openapi.py --check
      - name: Build
        run: cmake --build --preset debug
      - name: Build agent targets
        run: cmake --build --preset debug --target edgepulse-agent edgepulse-agent-test-hook
      - name: Assert agent binaries exist
        run: |
          test -x build/debug/bin/edgepulse-agent
          test -x build/debug/bin/edgepulse-agent-test-hook
          echo "Agent binaries found"
      - name: Test
        run: ctest --preset debug --output-on-failure
      # 环境变量门控的用例被跳过时全量 ctest 仍会绿。直接复用脚本里的锚定正则与
      # EXPECTED_TESTS，避免 CI 与本地门禁选中不同的用例集合；脚本会另起一次性容器，
      # 断言 7 项全部执行且输出不含跳过标记。
      - name: Assert external tests ran
        run: python scripts/run-external-tests.py
      # 服务容器已拉取 mysql:8.4，脚本复用本地镜像，不额外等待下载
      - name: Backup and restore round trip
        run: python scripts/backup_restore_mysql_test.py

  # 双实例 HA 验收用真实 Compose 起 MySQL/Redis/两实例/nginx，并做 SIGTERM/SIGKILL 切换。
  # 镜像构建在 4 核 runner 上通常需要十几分钟，因此单独成 Job 并给足超时；本地发布前
  # 仍必须跑同一命令，CI 只是补充回归。脚本自己在 finally 里 down -v，最后一步再兜底清理。
  ha-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show Docker versions
        run: docker version && docker compose version
      - name: HA two-instance acceptance
        run: python scripts/check-ha-stack.py --build --require-docker
      - name: Cleanup HA stack
        if: always()
        run: |
          env_file=build/gate/ha/ha.env
          override=build/gate/ha/docker-compose.ha.test.yml
          if [ -f "$env_file" ] && [ -f "$override" ]; then
            docker compose -p edgepulse-ha-check --project-directory deploy/docker \
              --env-file "$env_file" --profile agent-ca -f deploy/docker/docker-compose.ha.yml -f "$override" \
              down -v --remove-orphans || true
          fi
          ids=$(docker ps -aq --filter label=com.docker.compose.project=edgepulse-ha-check)
          if [ -n "$ids" ]; then xargs -r docker rm -f <<< "$ids"; fi
          volumes=$(docker volume ls -q --filter label=com.docker.compose.project=edgepulse-ha-check)
          if [ -n "$volumes" ]; then xargs -r docker volume rm <<< "$volumes"; fi

  agent-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++ g++-14 libssl-dev default-libmysqlclient-dev
      - name: Install Conan
        env:
          CC: gcc
          CXX: g++
        run: |
          pip install conan
          conan profile detect --force
      - name: Build engine package
        env:
          CC: gcc
          CXX: g++
        run: conan create 3rd/AsynGyanis/packaging/conan --build=missing -s compiler.cppstd=23 -s build_type=Release -o "&:with_mysql=True"
      - name: Install dependencies
        run: conan install . --build=missing -s compiler.cppstd=23 -s build_type=Release
      - name: Configure
        run: cmake --preset debug
      # E2E 只用 SQLite，不需要 MySQL/Redis 服务容器；测试钩子随 Agent 构建产出
      - name: Build control plane and agent
        run: cmake --build --preset debug --target edgepulse-server edgepulse-agent edgepulse-agent-test-hook
      - name: Run agent end-to-end
        run: python scripts/check-agent-e2e.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:latest -color
