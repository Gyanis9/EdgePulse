name: Bug 报告
description: 报告可复现的缺陷或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，并把日志、截图与配置里的令牌、Cookie、私钥、证书口令和个人信息删除。
        安全问题不要在这里公开，请按 SECURITY.md 的私密渠道报告。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 运行中的 EdgePulse 版本、镜像标签或提交号
      placeholder: "1.0.0 / 提交号"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker Compose
        - systemd
        - 本地开发（scripts/run-dev.sh）
        - 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、浏览器、数据库与 Redis 版本，以及是否启用多实例
      placeholder: "Windows 11 / Edge 130 / MySQL 8.4 / Redis 7"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净状态开始的最小步骤；涉及权限、租户或 Agent 证书时写清前置条件
      placeholder: |
        1. 使用管理员登录
        2. 创建节点并签发 enroll 令牌
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 包含错误码、响应包络与可观察到的状态变化
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 请先脱敏，删除 Authorization、Cookie、会话令牌、注册令牌、私钥、证书口令与个人信息
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有发现重复报告
          required: true
        - label: 我已删除日志、截图与配置中的秘密和个人信息
          required: true
