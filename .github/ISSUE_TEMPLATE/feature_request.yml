name: 功能请求
description: 提出新的使用场景或能力改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述要解决的问题，而不是只给实现方案。已明确延后的能力见 docs/ROADMAP.md。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与问题
      description: 谁在什么环境下遇到了什么阻碍；当前如何绕过
      placeholder: "租户管理员需要批量替换一批节点的分组，目前只能逐个编辑..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 描述期望的行为、接口或界面；不必写实现细节
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过的其他做法，以及为什么不满足
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: 影响面
      description: 涉及的模块、租户边界、权限码、配置、迁移、安全或部署变化
      placeholder: "新增管理端路由与权限码；需要 V19 迁移；影响 Agent 注册流程..."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 相关文档、截图或上游讨论；不要贴秘密
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 与 docs/ROADMAP.md，没有发现重复项
          required: true
